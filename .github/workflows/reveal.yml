name: Reveal the number

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start from your own fork
        if: github.repository == 'hazelfjeld/teach-github'
        run: |
          echo "Fork this repository, enable Actions in your fork, and run Reveal the number there."
          echo "## Fork first" >> "$GITHUB_STEP_SUMMARY"
          echo "Fork this repository, enable Actions in your fork, and run **Reveal the number** there." >> "$GITHUB_STEP_SUMMARY"

      - name: Check out your fork
        if: github.repository != 'hazelfjeld/teach-github'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Calculate, claim, and reveal
        if: github.repository != 'hazelfjeld/teach-github'
        env:
          CHALLENGE_URL: https://teach-github-challenge.airheadhazelnut.chatgpt.site
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/play.py
