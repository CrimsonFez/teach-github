name: Check the challenge

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Check the 200-line puzzle and runner
        run: python3 -m unittest discover -s tests -v
      - name: Check signed identity validation
        working-directory: verifier
        run: node tests/identity.test.mjs
      - name: Check competing winner claims
        working-directory: verifier
        run: node tests/race.test.mjs
